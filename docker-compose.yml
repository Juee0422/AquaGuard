version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquaguard-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - EARTHENGINE_PROJECT=aquaguard-hab-monitoring
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquaguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
